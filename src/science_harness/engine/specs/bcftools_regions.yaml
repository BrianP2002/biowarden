spec_version: "1"
name: bcftools_regions
version_note: >-
  bcftools 1.24 (htslib 1.24). Every behaviour the checkers rely on was run on this version; the
  evidence is quoted in engine/rules/bcftools_regions.py.
rules:
  # GEN-01: the base of a -R/-T file depends on its NAME. A conditional rule: it costs nothing when
  # the name already makes bcftools read the file the way its content is written.
  - id: bcftools.regions_file_base
    slot: index_base
    kind: call
    tier: T1
    incidents: [GEN-01]
    applies:
      tools: [bcftools]
      options_any: [-R, --regions-file, -T, --targets-file]
    declare:
      key: region_file_base
      values: [zero_based_half_open, one_based_closed]
      required: false
      description: >-
        How bcftools reads the coordinates of the -R/-T file in this call. State it only when the
        file name does not already decide it: a name ending in .bed or .bed.gz is read as BED
        (zero_based_half_open), any other name as CHROM POS [END] (one_based_closed).
    check: bcftools_regions_file_base
    params:
      # Subcommands that accept -R/-T (checked on bcftools 1.24). "+plugin" names are accepted too.
      subcommands:
        - annotate
        - call
        - cnv
        - concat
        - convert
        - csq
        - filter
        - gtcheck
        - isec
        - merge
        - mpileup
        - norm
        - plugin
        - query
        - roh
        - stats
        - view
    message: >-
      bcftools reads a regions/targets file as BED (0-based, half-open) only when its name ends in
      .bed or .bed.gz and as 1-based inclusive CHROM POS [END] otherwise, so BED intervals kept
      under another name are silently shifted by one base.

  # GEN-02: -R/-r overlap by default, -T/-t test only POS by default. Required, because the default
  # is dangerous and the incident is documented.
  - id: bcftools.region_semantics
    slot: interval_semantics
    kind: call
    tier: T0
    incidents: [GEN-02]
    applies:
      tools: [bcftools]
      # mpileup is left out on purpose: its -R/-T act on pileup positions and it has no
      # --regions-overlap/--targets-overlap. Subcommands are glob patterns, so "+*" is any plugin.
      subcommands:
        - annotate
        - call
        - cnv
        - concat
        - convert
        - csq
        - filter
        - gtcheck
        - isec
        - merge
        - norm
        - plugin
        - "+*"
        - query
        - roh
        - stats
        - view
      options_any: [-r, --regions, -R, --regions-file, -t, --targets, -T, --targets-file]
    declare:
      key: region_semantics
      values: [overlap, start_only]
      required: true
      description: >-
        Which records the regions/targets option of this call keeps: overlap = every record whose
        span (POS to its last base, INFO/END for a reference block) touches a region; start_only =
        only records whose POS lies inside a region.
    check: bcftools_region_semantics
    message: >-
      -R/-r (and -T/-t with --targets-overlap 1|2) keep every record that overlaps a region, but
      -T/-t (and -R/-r with --regions-overlap 0|pos) only records whose POS lies in one, so a gVCF
      reference block or a deletion that begins before the region is silently dropped.
