name: tests

# The tests that do not build whole workspaces (`-m "not slow"`), with the real programs the
# benchmark drives installed. A test that skips because samtools, bcftools, bedtools or the
# sandbox is missing would let this job pass while testing next to nothing, so such a skip, or
# more skips than MAX_SKIPS, fails the job. The conda environments of the tool packs are not
# built here: the tests that need them skip, and they are run on the cluster (the family gates).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # weekly: a new SDK or tool release that breaks the tests

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Set from the first run (the last step prints the count and the reasons); lower it, never raise it.
      MAX_SKIPS: "250"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install samtools, bcftools, bedtools and bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samtools bcftools bedtools bubblewrap
          samtools --version | head -n 1
          bcftools --version | head -n 1
          bedtools --version
          bwrap --version

      - name: Allow unprivileged user namespaces (bubblewrap needs them)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install the package with the test and SDK extras
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -m "not slow" -n auto -q -ra --junitxml=junit.xml

      - name: Count the skips
        if: always()
        run: |
          python - <<'PY'
          import collections
          import os
          import re
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse("junit.xml").getroot().iter("testcase"))
          reasons = collections.Counter()
          for case in cases:
              skipped = case.find("skipped")
              if skipped is not None:
                  reasons[(skipped.get("message") or "").strip()[:110]] += 1
          total, limit = sum(reasons.values()), int(os.environ["MAX_SKIPS"])
          print(f"{total} of {len(cases)} tests skipped (limit {limit})")
          for reason, count in reasons.most_common():
              print(f"{count:5}  {reason}")
          # what this job installed must not be the reason for a skip
          core = re.compile(r"samtools, bcftools and bedtools|bubblewrap|bwrap", re.IGNORECASE)
          missing = {r: n for r, n in reasons.items() if core.search(r)}
          if missing:
              print("skipped for a program this job installed:", missing)
          sys.exit(1 if missing or total > limit else 0)
          PY
